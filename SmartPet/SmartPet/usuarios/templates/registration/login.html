{% extends "base.html" %}

{% block content %}

{% load static %}
{% load crispy_forms_tags %}

<link rel="stylesheet" href="{% static 'css/StyleRegistro.css' %}">

<body class="body-registro">
  
    <form method="post" autocomplete="off" class="form-registro">
        {% csrf_token %}
        <h2>¡Bienvenido!</h2>
        <p>Inicia sesión</p>

        <div class="input-wrapper">
            {{ form.username|as_crispy_field }}
            <img class="input-icon" src="{% static 'Img/email.svg' %}" alt="">
        </div>

        <div class="input-wrapper">
            {{ form.password|as_crispy_field }}
            <img class="input-icon" src="{% static 'Img/contraseña.svg' %}" alt="">
        </div>
        
        <div class="mt-3">
            <a href="{% url 'register' %}">¿No tienes cuenta? Regístrate</a>
        </div>

        <input class="btn-enviar" type="submit" value="Enviar">
    </form>
    
</body>

{% endblock %}
