{% extends "base.html" %}
{% load static %}

{% block content %}
<body style="background-color:#f8f9fa;">
  <div class="container mt-4 mb-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <div class="d-flex justify-content-between align-items-center mb-3">
        </div>
    
    <div class="alert alert-info text-center py-2 shadow-sm">
        </div>

    <div class="row">
        <div class="col-lg-8 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="mb-3 fw-bold">Productos en tu carrito</h5>
                    <table class="table align-middle table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th>Nombre</th>
                                <th class="text-center">Cantidad</th>
                                <th class="text-center">Precio</th>
                                <th class="text-center">Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="carrito-body">
                            </tbody>
                    </table>
                    <div class="text-end mt-3">
                        <button id="vaciar-carrito" class="btn btn-outline-danger btn-sm">Vaciar carrito</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 sticky-top" style="top: 90px;">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Resumen de compra</h5>
                    <form action="{% url 'crear_pedido' %}" method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold shadow-sm">Proceder al pago</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
  </div>
</body>
{% endblock %}
