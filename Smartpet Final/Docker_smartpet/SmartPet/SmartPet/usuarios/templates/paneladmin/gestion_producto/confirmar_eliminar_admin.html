{% extends "base.html" %}

{% block content %}

<!-- Contenedor principal con márgenes -->
<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Tarjeta principal con borde rojo para resaltar advertencia -->
            <div class="card shadow-sm border-danger">
                
                <div class="card-body text-center">
                    
                    <!-- Título de advertencia -->
                    <h2 class="card-title text-danger mb-3">Confirmar Ocultar</h2>

                    <!-- Mensaje que muestra el nombre del producto a eliminar -->
                    <p class="lead">
                        ¿Estás seguro de que deseas ocultar el producto 
                        <strong>"{{ producto.nombre }}"</strong>?
                    </p>

                    <!-- Formulario que envía la confirmación al servidor -->
                    <form method="POST">
                        {% csrf_token %}

                        <!-- Botones centrados: confirmar o cancelar -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">

                            <!-- Botón de eliminación -->
                            <button type="submit" class="btn btn-danger">
                                Sí, Ocultar
                            </button>

                            <!-- Botón para volver sin eliminar -->
                            <a href="{% url 'lista_productos_admin' %}" class="btn btn-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
