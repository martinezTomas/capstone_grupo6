{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">

<main class="d-flex justify-content-center align-items-center py-5" style="min-height: 80vh;">
  <div class="login-card">
      <h2 class="text-center">¡Bienvenido!</h2>
      <p class="text-center">Inicia sesión para continuar</p>

      <form method="post" autocomplete="off">
          {% csrf_token %}
          <div class="mb-3">
              <label class="form-label fw-semibold">Usuario</label>
              <div class="input-group">
                  <span class="input-group-text">
                      <img src="{% static 'Img/email.svg' %}" alt="user icon" style="width:20px;">
                  </span>
                  <input type="text" name="username" id="id_username" class="form-control" placeholder="Ingresa tu usuario" required>
              </div>
          </div>

          <div class="mb-4">
              <label class="form-label fw-semibold">Contraseña</label>
              <div class="input-group">
                  <span class="input-group-text">
                      <img src="{% static 'Img/contraseña.svg' %}" alt="password icon" style="width:20px;">
                  </span>
                  <input type="password" name="password" id="id_password" class="form-control" placeholder="********" required>
              </div>
          </div>

          <button type="submit" class="btn-login">Iniciar sesión</button>

          <div class="text-center text-register mt-3">
              <p>¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate</a></p>
          </div>
      </form>
  </div>
</main>
{% endblock %}
